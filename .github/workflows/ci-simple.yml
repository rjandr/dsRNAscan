name: CI Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test - ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: ${{ matrix.python-version }}
        channels: conda-forge,bioconda,defaults
        activate-environment: test
        auto-activate-base: false

    - name: Install dependencies
      run: |
        conda install -y viennarna
        pip install .

    - name: Run tests
      run: |
        dsrnascan --version

        # Create test sequence with known inverted repeat
        echo ">test" > test.fa
        echo "GGGGGGGGGGGGGGGGNNNNNNNNNNNNNNNNCCCCCCCCCCCCCCCC" >> test.fa

        # Run dsrnascan
        dsrnascan test.fa -w 100 -s 50 --min_bp 10 -c 1

        # Verify output
        if [ -f dsrnascan_*/*_merged_results.txt ]; then
            echo "dsRNAscan completed successfully"
            cat dsrnascan_*/*_merged_results.txt
        else
            echo "ERROR: No results file created!"
            exit 1
        fi
